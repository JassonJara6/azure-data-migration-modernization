name: Databricks infrastructure offline checks
on:
  pull_request:
    paths: ['terraform/**', 'automation/silver/**', '.github/workflows/databricks-infrastructure-tests.yml']
  push:
    branches: ['feature/databricks-infrastructure', 'feature/databricks-identity-bootstrap', 'feature/unity-catalog-workspace-bootstrap', 'fix/databricks-cli-provider-auth', 'fix/terraform-plan-approval-integrity', 'fix/silver-wheel-onedrive']
    paths: ['terraform/**', 'automation/silver/**', '.github/workflows/databricks-infrastructure-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Install pinned CLI for strict loopback Workspace API tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/admm-cli"
          curl --fail --silent --show-error --location https://github.com/databricks/cli/releases/download/v1.22.1/databricks_cli_1.22.1_linux_amd64.zip -o "$RUNNER_TEMP/admm-cli.zip"
          echo "2f24260441f211e75df4266fba506983cd2373c622cb34437d752befba8261af  $RUNNER_TEMP/admm-cli.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/admm-cli.zip" databricks -d "$RUNNER_TEMP/admm-cli"
          chmod +x "$RUNNER_TEMP/admm-cli/databricks"
          echo "SILVER_DATABRICKS_BIN=$RUNNER_TEMP/admm-cli/databricks" >> "$GITHUB_ENV"
      - run: python -m pip install -r automation/silver/requirements.txt
      - run: terraform fmt -check -recursive terraform/environments/dev terraform/modules/databricks_workspace terraform/databricks/dev terraform/databricks/workspace
      - name: Validate existing platform without initializing the real backend
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/environments/dev validate
          terraform -chdir=terraform/environments/dev test -no-color
      - name: Validate workspace module with mock plans only
        run: |
          terraform -chdir=terraform/modules/databricks_workspace init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/modules/databricks_workspace validate
          terraform -chdir=terraform/modules/databricks_workspace test -no-color
      - name: Validate UC without account credentials or remote state
        run: |
          terraform -chdir=terraform/databricks/dev init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/databricks/dev validate
          terraform -chdir=terraform/databricks/dev test -no-color
      - name: Validate workspace-only UC without account provider or remote state
        run: |
          terraform -chdir=terraform/databricks/workspace init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/databricks/workspace validate
          terraform -chdir=terraform/databricks/workspace test -no-color
      - name: Test approval integrity, fresh wheels and loopback OAuth transport
        env:
          SILVER_PROVIDER_AUTH_TESTS: '1'
          SILVER_WHEEL_BUILD_TESTS: '1'
        run: python -m pytest -q automation/silver/tests
      - run: python -m compileall -q automation/silver
