[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admm-gold"
version = "0.1.0"
description = "Local AdventureWorks sales dimensional model on Silver Delta snapshots"
requires-python = ">=3.11"
dependencies = ["admm-silver>=0.1.0", "pyspark==3.5.3", "delta-spark==3.2.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pyspark==3.5.3", "delta-spark==3.2.1"]
