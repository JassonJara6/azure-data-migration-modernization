[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admm-silver"
version = "0.1.0"
description = "Committed AdventureWorks Bronze to Unity Catalog Silver Delta"
requires-python = ">=3.10"
dependencies = ["pyarrow>=14,<20"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pyspark==3.5.3", "delta-spark==3.2.1", "pyyaml>=6,<7"]

[tool.setuptools.package-data]
admm_silver = ["contract.json"]
